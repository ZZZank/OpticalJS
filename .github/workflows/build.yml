
name: build
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        default: false
        required: false
        description: Publish built mod file

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: setup Gradle wrapper
        uses: gradle/actions/setup-gradle@v4

      - name: setup Java
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: 'zulu'

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build
        run: ./gradlew build

      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/libs/

      - name: publish
        if: ${{ inputs.publish }}
        # TODO: remove '--no-configuration-cache' when modpublisher supports it
        run: ./gradlew publishMod --no-configuration-cache
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSE_TOKEN: ${{ secrets.CURSE_TOKEN }}
          # GITHUB_TOKEN is generated automatically, so it will publish whenever 'publish.github' is defined